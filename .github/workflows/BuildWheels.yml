name: OpenMM-Setup-Build-Wheels

env:
  GIT_REVISION: '888de0e'

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    name: "${{ matrix.name }} ${{ matrix.python-version}}"
    strategy:
      matrix:
        python-version: ["3.13"]
        include:
          - name: Linux x86
            os: ubuntu-latest
            requirements: linux

    steps:
      - uses: actions/checkout@v3

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: build-env
          create-args: >-
            python=${{ matrix.python-version }}
          init-shell: bash

      - name: "Install dependencies with pip"
        shell: bash -l {0}
        run: pip install -v -r devtools/requirements/${{ matrix.requirements }}.txt

      - name: "Check out OpenMM-Setup source code"
        run: |
          git clone https://github.com/openmm/openmm-setup.git
          cd openmm-setup
          git checkout $GIT_REVISION

      - name: "Build wheel"
        shell: bash -l {0}
        run: |
          cd openmm-setup
          python -m build --sdist

      - name: "Test the wheel"
        shell: bash -l {0}
        run: |
          python -m venv "${HOME}/test_env"
          source "${HOME}/test_env/bin/activate"
          cd openmm-setup
          pip install --pre -f dist openmm-setup
          openmm-setup --help

      - name: "Upload the wheel"
        uses: actions/upload-artifact@v4
        with:
          name: openmm-setup-wheel-${{matrix.python-version}}
          path: openmm-setup/dist
          retention-days: 10
